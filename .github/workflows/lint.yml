# A name used but never imported builds fine and then shows a blank screen in
# the app. ESLint's no-undef catches exactly that, so it runs on every push.
# It is deliberately a job of its own: a lint complaint should never stand
# between a finished app and the Play Store.
name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - id: lint
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee /tmp/lint.txt
      # Temporary: surface the findings where they can be read without the
      # Actions log viewer.
      - if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head -c 50000 /tmp/lint.txt > /tmp/lint-short.txt
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments \
            -f body="$(printf '```\n%s\n```' "$(cat /tmp/lint-short.txt)")"
