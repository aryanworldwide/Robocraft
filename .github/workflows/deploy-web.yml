# Publishes the web / iPhone version to GitHub Pages on every push.
# Live at: https://<user>.github.io/<repo>/
name: Deploy web app (iPhone & browsers)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm run build
          cp dist/index.html dist/404.html   # deep links like /lesson/xyz work on refresh
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
