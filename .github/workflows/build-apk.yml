# Builds the RoboCraft Android APK in the cloud on every push (or manually).
# Download it from: GitHub repo -> Actions -> latest run -> Artifacts -> robocraft-apk
name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: robocraft-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a release (easy download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk RoboCraft.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest RoboCraft.apk \
            --title "RoboCraft APK (latest build)" \
            --notes "Built from commit ${GITHUB_SHA::7}. Download RoboCraft.apk below and install it on your Android phone." \
            --latest
