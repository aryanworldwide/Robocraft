# Builds the RoboCraft Android APK in the cloud on every push (or manually).
# Download it from: GitHub repo -> Actions -> latest run -> Artifacts -> robocraft-apk
name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Build web app
        env:
          # Optional repo secrets (Settings -> Secrets -> Actions). Without them the
          # app still works in guest mode; login and AI features need them.
          VITE_APP_ID: ${{ secrets.VITE_APP_ID }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Create Android project
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: robocraft-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
